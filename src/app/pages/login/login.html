
<div class="login">

  <h2>Iniciar sesión</h2>

  <form [formGroup]="formulario" (ngSubmit)="iniciarSesion()">

    <div class="campo">
      <label for="username">Usuario</label>

      <input
        id="username"
        type="text"
        formControlName="username"
        placeholder="Ingresa tu usuario"
      >

      @if (formulario.controls.username.touched &&
           formulario.controls.username.invalid) {
        <p class="error">El usuario es obligatorio</p>
      }
    </div>

    <div class="campo">
      <label for="password">Contraseña</label>

      <input
        id="password"
        type="password"
        formControlName="password"
        placeholder="Ingresa tu contraseña"
      >

      @if (formulario.controls.password.touched &&
           formulario.controls.password.invalid) {
        <p class="error">La contraseña es obligatoria</p>
      }
    </div>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <button type="submit" [disabled]="loading()">
      {{ loading() ? 'Ingresando...' : 'Ingresar' }}
    </button>

  </form>

</div>
